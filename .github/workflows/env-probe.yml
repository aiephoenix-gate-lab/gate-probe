name: env-probe
on:
  workflow_dispatch:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  reach-report-env:
    runs-on: ubuntu-latest
    environment: report
    steps:
      - name: Secret visibility
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF secret_length=${#PROBE_SECRET}"
