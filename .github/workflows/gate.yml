name: gate
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      event:
        required: false
        type: string
        default: manual
permissions:
  contents: read
  statuses: write
jobs:
  report:
    runs-on: ubuntu-latest
    environment: report
    steps:
      - name: Validate doorbell inputs
        env:
          SHA: ${{ inputs.sha }}
          EVENT: ${{ inputs.event }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "rejected: sha is not a full commit id"; exit 1; }
          case "$EVENT" in pull_request|merge_group|manual) ;; *) echo "rejected: unknown event"; exit 1;; esac
          echo "RUNNING GITHUB-GATE DEFINITION ref=$GITHUB_REF event_input=$EVENT"
      - name: Secret visibility
        env:
          PROBE_SECRET: ${{ secrets.PROBE_SECRET }}
        run: echo "secret_length=${#PROBE_SECRET}"
      - name: Report status on target commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=gate/track \
            -f description="reported by github-gate run $GITHUB_RUN_ID"
