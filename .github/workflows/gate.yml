name: gate
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      event:
        required: false
        type: string
        default: manual
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    environment: report
    steps:
      - name: Validate doorbell inputs
        env:
          SHA: ${{ inputs.sha }}
          EVENT: ${{ inputs.event }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "rejected: sha is not a full commit id"; exit 1; }
          case "$EVENT" in pull_request|merge_group|manual) ;; *) echo "rejected: unknown event"; exit 1;; esac
          echo "RUNNING GITHUB-GATE DEFINITION ref=$GITHUB_REF event_input=$EVENT"
      - name: Mint report identity token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: gate-probe
          permission-statuses: write
      - name: Report status on target commit as the report identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ inputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=gate/track \
            -f description="reported by report identity, run $GITHUB_RUN_ID"
  board:
    if: inputs.event == 'manual'
    runs-on: ubuntu-latest
    environment: report
    steps:
      - name: Mint a board-read token for the report identity
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: aiephoenix-gate-lab
          permission-organization-projects: read
      - name: Read the organization project board
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api graphql -f query='query { organization(login: "aiephoenix-gate-lab") { projectsV2(first: 5) { nodes { number title } } } }' --jq '.data.organization.projectsV2.nodes'
      - name: Compare with the default token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query { organization(login: "aiephoenix-gate-lab") { projectsV2(first: 5) { nodes { number title } } } }' --jq '.data.organization.projectsV2.nodes' || echo "default token cannot read the board"
