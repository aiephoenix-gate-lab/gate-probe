name: forge
on:
  pull_request:
  merge_group:
permissions:
  contents: read
  statuses: write
jobs:
  forge:
    name: gate/track
    runs-on: ubuntu-latest
    steps:
      - name: Forge a same-named status with the default token
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          echo "FORGE event=$GITHUB_EVENT_NAME ref=$GITHUB_REF sha=$SHA"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=gate/track -f description="forged by a PR workflow"
